name: Publish DeathStarBench Social Network candidate images

on:
  workflow_dispatch:
    inputs:
      publication:
        description: Candidate artifact to publish
        type: choice
        required: true
        default: load-driver
        options:
          - load-driver
          - workload-images

permissions:
  contents: read
  packages: write

concurrency:
  group: deathstarbench-social-images-${{ github.run_id }}
  cancel-in-progress: false

env:
  UPSTREAM_REVISION: 6ecb09706140f8730b5385c08f1386c654c3c526

jobs:
  publish-load-driver:
    name: Build, publish, attest, and lock amd64 load driver
    if: github.event.inputs.publication == 'load-driver'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out benchmark application
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out exact DeathStarBench source and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: delimitrou/DeathStarBench
          ref: 6ecb09706140f8730b5385c08f1386c654c3c526
          path: .build/upstream
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Fetch checksum-pinned LuaSocket source
        run: |
          set -euo pipefail
          mkdir -p .build/sources
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-delay 5 \
            https://luarocks.org/manifests/lunarmodules/luasocket-3.1.0-1.src.rock \
            --output .build/sources/luasocket-3.1.0-1.src.rock
          echo 'f4a207f50a3f99ad65def8e29c54ac9aac668b216476f7fae3fae92413398ed2  .build/sources/luasocket-3.1.0-1.src.rock' \
            | sha256sum --check --strict -

      - name: Prepare drift-checked load-driver context
        run: |
          set -euo pipefail
          python3 scripts/prepare_deathstarbench_load_driver.py \
            --upstream .build/upstream \
            --luasocket-rock .build/sources/luasocket-3.1.0-1.src.rock \
            --output .build/load-driver
          {
            echo "LOAD_DRIVER_CONTEXT_SHA256=$(python3 -c 'import json; print(json.load(open(".build/load-driver/context-manifest.json"))["context_sha256"])')"
            echo "WRK2_SOURCE_SHA256=$(python3 -c 'import json; print(json.load(open(".build/load-driver/context-manifest.json"))["wrk2_source_sha256"])')"
          } >> "$GITHUB_ENV"

      - name: Derive load-driver candidate name
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_IDENTIFIER: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          case "$owner" in
            ''|*[!a-z0-9_.-]*)
              echo "The GHCR owner is invalid after normalization." >&2
              exit 1
              ;;
          esac
          {
            echo "LOAD_DRIVER_IMAGE=ghcr.io/${owner}/deathstarbench-load-driver"
            echo "LOAD_DRIVER_TAG=wrk2-6ecb097-${RUN_IDENTIFIER}-${RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 load-driver candidate
        id: build-load-driver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/load-driver/context
          file: .build/load-driver/context/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.LOAD_DRIVER_IMAGE }}:${{ env.LOAD_DRIVER_TAG }}
          build-args: |
            LOAD_DRIVER_CONTEXT_SHA256=${{ env.LOAD_DRIVER_CONTEXT_SHA256 }}
            WRK2_SOURCE_SHA256=${{ env.WRK2_SOURCE_SHA256 }}
            OCI_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            OCI_SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Resolve and attest exact amd64 platform manifest
        env:
          LOAD_DRIVER_INDEX_DIGEST: ${{ steps.build-load-driver.outputs.digest }}
        run: |
          set -euo pipefail
          load_driver_index="${LOAD_DRIVER_IMAGE}:${LOAD_DRIVER_TAG}@${LOAD_DRIVER_INDEX_DIGEST}"
          python3 scripts/create_deathstarbench_image_lock.py \
            --resolve-load-driver-image \
            --load-driver-image "$load_driver_index" \
            --output .build/load-driver-image.txt
          load_driver_ref=$(tr -d '\n' < .build/load-driver-image.txt)
          test -n "$load_driver_ref"
          docker pull --platform linux/amd64 "$load_driver_ref"
          docker run --rm --platform linux/amd64 --read-only \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            "$load_driver_ref" attest \
            > .build/load-driver-attestation.txt
          python3 scripts/create_deathstarbench_image_lock.py \
            --merge-load-driver \
            --base-workload-lock docs/qualification/deathstarbench-social-network-images-v1.json \
            --load-driver-context-manifest .build/load-driver/context-manifest.json \
            --load-driver-image "$load_driver_index" \
            --load-driver-attestation .build/load-driver-attestation.txt \
            --output .build/deathstarbench-social-image-lock.json

      - name: Upload immutable load-driver evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deathstarbench-load-driver-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/deathstarbench-social-image-lock.json
            .build/load-driver/context-manifest.json
            .build/load-driver-image.txt
            .build/load-driver-attestation.txt
          if-no-files-found: error
          retention-days: 90

      - name: Record load-driver publication requirements
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## DeathStarBench amd64 load-driver candidate

          The artifact lock binds the exact amd64 platform manifest, wrk2
          binary, build context, upstream wrk2 tree, LuaJIT revision, LuaSocket
          source, and Social Network request script. BuildKit provenance and an
          SBOM are attached to the published index.

          GHCR creates new packages as private by default. A package owner must
          change `deathstarbench-load-driver` to **Public**, then independently
          verify an anonymous pull of the exact platform digest before adopting
          the candidate lock. Publication and anonymous pull qualification do
          not by themselves change the checked-in release flag.
          SUMMARY

  publish-candidate:
    name: Build, publish, and lock candidate images
    if: github.event.inputs.publication == 'workload-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out benchmark application
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out exact DeathStarBench source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: delimitrou/DeathStarBench
          ref: 6ecb09706140f8730b5385c08f1386c654c3c526
          path: .build/upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare drift-checked build contexts
        run: >-
          python3 scripts/prepare_deathstarbench_social_images.py
          --upstream .build/upstream
          --output .build/contexts

      - name: Derive candidate image names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_IDENTIFIER: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          case "$owner" in
            ''|*[!a-z0-9_.-]*)
              echo "The GHCR owner is invalid after normalization." >&2
              exit 1
              ;;
          esac
          short_revision=${UPSTREAM_REVISION%%????????????????????????????}
          image_tag="dsb-${short_revision}-${RUN_IDENTIFIER}-${RUN_ATTEMPT}"
          {
            echo "IMAGE_TAG=${image_tag}"
            echo "APP_IMAGE=ghcr.io/${owner}/deathstarbench-social-app"
            echo "FRONTEND_IMAGE=ghcr.io/${owner}/deathstarbench-social-frontend"
            echo "MEDIA_FRONTEND_IMAGE=ghcr.io/${owner}/deathstarbench-social-media-frontend"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Preflight support images and deployment lock schema
        run: |
          set -euo pipefail
          python3 scripts/create_deathstarbench_image_lock.py \
            --context-manifest .build/contexts/context-manifest.json \
            --preflight-third-party \
            --output .build/deathstarbench-social-support-preflight.json

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application candidate
        id: build-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/contexts/app
          file: .build/contexts/app/Dockerfile.candidate
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            OCI_SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and publish frontend candidate
        id: build-frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/contexts/frontend
          file: .build/contexts/frontend/Dockerfile.candidate
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            OCI_SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and publish media frontend candidate
        id: build-media-frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/contexts/media_frontend
          file: .build/contexts/media_frontend/Dockerfile.candidate
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.MEDIA_FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            OCI_SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Resolve exact platform digests
        env:
          APP_INDEX_DIGEST: ${{ steps.build-app.outputs.digest }}
          FRONTEND_INDEX_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          MEDIA_FRONTEND_INDEX_DIGEST: ${{ steps.build-media-frontend.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/create_deathstarbench_image_lock.py \
            --context-manifest .build/contexts/context-manifest.json \
            --third-party-preflight .build/deathstarbench-social-support-preflight.json \
            --base-workload-lock docs/qualification/deathstarbench-social-network-images-v1.json \
            --output .build/deathstarbench-social-image-lock.json \
            --app-image "${APP_IMAGE}:${IMAGE_TAG}@${APP_INDEX_DIGEST}" \
            --frontend-image "${FRONTEND_IMAGE}:${IMAGE_TAG}@${FRONTEND_INDEX_DIGEST}" \
            --media-frontend-image "${MEDIA_FRONTEND_IMAGE}:${IMAGE_TAG}@${MEDIA_FRONTEND_INDEX_DIGEST}"

      - name: Upload candidate image lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deathstarbench-social-image-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/deathstarbench-social-image-lock.json
            .build/deathstarbench-social-support-preflight.json
            .build/contexts/context-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Record publication limitations
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## DeathStarBench candidate publication

          The artifact contains exact `linux/amd64` and `linux/arm64` digests
          for all custom and supporting images. These are candidate images;
          the deployment release gate remains closed until live qualification.

          GHCR creates new packages as private by default. A package owner must
          change all three `deathstarbench-social-*` packages to **Public** in
          the GitHub package settings before an Azure K3s node can pull them
          anonymously. A successful workflow run does not prove public pull
          access.

          The lock makes this published runtime immutable. It does not promise
          byte-for-byte rebuilds because the pinned upstream Dockerfiles still
          consume mutable package repositories and incompletely checksummed
          build downloads.
          SUMMARY
